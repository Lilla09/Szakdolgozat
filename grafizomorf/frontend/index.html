<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráf Izomorfizmus</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    

</head>
<body>
    <header class="main-header">
        <h1>Gráfizomorfizmus</h1>
        
        <div class="header-actions">
            <button id="header-back-btn" class="header-btn" onclick="backToMenu()" style="display: none;">Vissza</button>
            <span class="header-btn" onclick="openInfo()">Info</span>
        </div>
    </header>

    <main class="menu-container" id="main-menu">
        <button class="menu-btn" onclick="openSection('rajzolo')">Gráfok rajzolása</button>
        <button class="menu-btn" onclick="openSection('izomorf')">Izomorf-e?</button>
    </main>

 <section id="rajzolo-page" style="display:none;">
    
    <div class="toolbar">
    <button id="btn-node" class="tool-btn" onclick="setMode('node')">Csúcs felvétele</button>
    <button id="btn-edge" class="tool-btn" onclick="setMode('edge')">Él felvétele</button>
    <button id="btn-delete" class="tool-btn" onclick="setMode('delete')">Törlés</button>
    <button class="tool-btn clear-all" onclick="fullClear()">Teljes törlés</button>
    <button class="tool-btn check-btn" onclick="checkIsomorphism()">Izomorfak?</button>
</div>
    <div class="workspace">
            <div class="graph-box">
                <div class="label">"A" Gráf</div>
                <div id="cy1"></div>
            </div>
            <div class="graph-box">
                <div class="label">"B" Gráf</div>
                <div id="cy2"></div>
            </div>
</section>

    <div id="infoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeInfo()">&times;</span>
            <h2>Használati útmutató</h2>
            <div class="info-text">
                <p><strong>Gráfok rajzolása:</strong> Kattints a fehér területre új pontok lerakásához.</p>
                <p><strong>Izomorf-e?:</strong> Két gráf szerkezeti azonosságának vizsgálata.</p>
            </div>
        </div>
    </div>

<div id="resultModal" class="modal">
    <div class="modal-content result-content">
        <span class="close" onclick="closeResult()">&times;</span>
        <h2>Izomorfizmus Vizsgálat</h2>
        <hr>
        <ul id="check-list"></ul>
        <div id="final-verdict"></div>
        
        <div id="brute-force-container" style="text-align: center; margin-top: 20px; display: none;">
            <button id="btn-brute-force" class="tool-btn check-btn" onclick="startBruteForce()">
                Biztosra akarom tudni (Brute Force)
            </button>
        </div>
    </div>
</div>

    <script src="../backend/graph.js"></script>
    <script src="../backend/izomorfizm.js"></script>


    <script src="ui.js"></script> 
    

</body>
</html>
